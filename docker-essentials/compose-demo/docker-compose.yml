services:
  web:
    image: nginx:alpine
    container_name: demo-web
    ports:
      - "${HOST_PORT:-8080}:80"
    networks:
      - demo-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 5s
      timeout: 3s
      retries: 5

  client:
    image: alpine:3.20
    container_name: demo-client
    command: sh -c "apk add --no-cache curl >/dev/null && tail -f /dev/null"
    networks:
      - demo-net
    depends_on:
      web:
        condition: service_healthy

networks:
  demo-net:
    name: demo-net
    driver: bridge
